name: Github CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          export PATH=${PATH}:${HOME}/.codon/bin
          echo "PATH=${PATH}" >> $GITHUB_ENV
      - name: Check out repository code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Codon Python bridge
        run: |
          pip install find_libpython
          export CODON_PYTHON=$(find_libpython)
          echo "Found Python at: ${CODON_PYTHON}"
          echo "CODON_PYTHON=${CODON_PYTHON}" >> $GITHUB_ENV
          pip install matplotlib  # Dependencies for week1
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      
    #---------------------- Week 1 Deliverable --------------------------------
    #  - name: Week 1
    #   run: bash week1/evaluate.sh
    
    #---------------------- Week 2 Deliverable  -------------------------------------
    #  - name: Week 2
    #    run: bash week2/evaluate.sh

    #---------------------- Week 3 Deliverable  -------------------------------------
    #  - name: Week 3
    #    run: bash week3/evaluate.sh
        
    #---------------------- Week 4 Deliverable  -------------------------------------
    #  - name: Week 4
    #    run: bash week4/evaluate.sh
    
    #---------------------- Week 5/6 Deliverable  -------------------------------------
      - name: Set up bioinformatics toolchain (bioconda)
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          environment-name: bio
          init-shell: bash
          cache-downloads: true
          cache-environment: true
          create-args: >-
            python=3.11
            jupyter nbclient nbconvert ipykernel
            wget curl bzip2
            samtools
            bcftools
            minimap2
            hapcut2
            htslib
            pandas
            pip

      - name: Register Jupyter kernel for this env
        shell: bash -l {0}
        run: |
          python -m ipykernel install --user --name=bio --display-name "Python (bio)"

      - name: Execute week5.ipynb (as required: `jupyter execute week5.ipynb`)
        shell: bash -l {0}
        working-directory: week5
        run: |
          jupyter execute week5.ipynb \
            --inplace \
            --ExecutePreprocessor.kernel_name=bio \
            --ExecutePreprocessor.timeout=7200 \
          || \
          jupyter nbconvert --to notebook --execute week5.ipynb \
            --output week5.ipynb \
            --ExecutePreprocessor.kernel_name=bio \
            --ExecutePreprocessor.timeout=7200
